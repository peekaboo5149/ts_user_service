name: Publish Image

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
      - release/*
      - dev

concurrency:
  group: publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Make scripts executable
        run: |
          chmod +x .github/scripts/generate-tag.sh

      - name: Generate Docker tag
        id: generate_tag
        run: |
          VERSION=$(
            .github/scripts/generate-tag.sh \
            "${{ github.event.workflow_run.head_branch }}" \
            "${{ github.event.workflow_run.head_sha }}"
          )

          echo "Generated tag: $VERSION"

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine latest tag
        id: latest_tag
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"

          if [[ "$BRANCH" == release/* ]]; then
            echo "LATEST_TAG=latest-release" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == dev ]]; then
            echo "LATEST_TAG=latest-dev" >> "$GITHUB_OUTPUT"
          else
            echo "LATEST_TAG=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.generate_tag.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.latest_tag.outputs.LATEST_TAG }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.created=${{ github.run_id }}