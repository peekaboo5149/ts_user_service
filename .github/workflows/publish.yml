name: Publish Image

on:
  push:
    branches:
      - main
      - release/*
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine conventional commit type
        id: commit
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $MSG"

          if echo "$MSG" | grep -q "BREAKING CHANGE"; then
            echo "type=breaking" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif echo "$MSG" | grep -qE "^fix(\(.+\))?!?: "; then
            echo "type=fix" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif echo "$MSG" | grep -qE "^feat(\(.+\))?!?: "; then
            echo "type=feat" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif echo "$MSG" | grep -qE "^perf(\(.+\))?!?: "; then
            echo "type=perf" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "type=other" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Docker tag
        id: generate_tag
        if: steps.commit.outputs.publish == 'true'
        run: |
          MAJOR=$(git log --pretty=%s | grep -c "BREAKING CHANGE" || true)
          MINOR=$(git log --pretty=%s | grep -cE "^feat(\(.+\))?!?: " || true)
          PATCH=$(git log --pretty=%s | grep -cE "^(fix|perf)(\(.+\))?!?: " || true)

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Generated tag: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.commit.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.commit.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.commit.outputs.publish == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.generate_tag.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
