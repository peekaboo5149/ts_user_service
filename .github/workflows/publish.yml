name: Publish Image

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
      - release/*
      - dev

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Determine branch suffix
        id: suffix
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"

          if [[ "$BRANCH" == release/* ]]; then
            echo "suffix=-release" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == dev ]]; then
            echo "suffix=-dev" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Docker tag
        id: generate_tag
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          SHORT_SHA=$(git rev-parse --short HEAD)

          VERSION="${TIMESTAMP}-${SHORT_SHA}${{ steps.suffix.outputs.suffix }}"

          echo "Generated tag: $VERSION"
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.generate_tag.outputs.VERSION }}