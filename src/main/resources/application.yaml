logging:
  level:
    root: info
    org.springframework.kafka: INFO
    org.apache.kafka.common.config: WARN

spring:
  application:
    name: ts_user_service
  web:
    resources:
      add-mappings: false
  mongodb:
    uri: ${TS_USER_SERVICE_MONGODB_URI}
  kafka:
    bootstrap-servers: ${TS_USER_SERVICE_KAFKA_BOOTSTRAP_SERVERS}
    admin:
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    mongodb:
      auto-index-creation: true


management:
  prometheus:
    metrics:
      export:
        properties:
          io:
            prometheus:
              exporter:
                exemplarsOnAllMetricTypes: false
  server:
    port: 10103
  endpoints:
    web:
      exposure:
        include: "health,prometheus,info,db,metrics"
    access:
      default: read_only
  endpoint:
    health:
      probes:
        enabled: true

mandatory:
  headers:
    routesToSkip:
      - "/actuator"
    startsWith:
      - "/actuator/"

app:
  events:
    user-events:
      topic_name: ${TS_USER_SERVICE_USER_EVENT_TOPIC_NAME}